<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" role="img" aria-labelledby="dfnSchemaTitle dfnSchemaDesc" font-family="Arial, Helvetica, sans-serif">
  <title id="dfnSchemaTitle">Schema di copertura e telemetria del presidio Tempestivo Defender</title>
  <desc id="dfnSchemaDesc">Vista dall'alto di un giardino con modulo di emissione biomimetica, tre fasce di copertura fino a 4.000 metri quadri, zona ospiti, piscina e collegamento dati verso un pannello di telemetria con livello serbatoio e stato del servizio.</desc>
  <defs>
    <linearGradient id="dfnPlanBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FCF9"/>
      <stop offset="1" stop-color="#EDF8F1"/>
    </linearGradient>
    <linearGradient id="dfnLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3F5EA"/>
      <stop offset="1" stop-color="#D6EFE1"/>
    </linearGradient>
    <radialGradient id="dfnEmission" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2FD08A" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#2FD08A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2FD08A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dfnPool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9F1FA"/>
      <stop offset="1" stop-color="#BFE7F4"/>
    </linearGradient>
    <clipPath id="dfnGardenClip">
      <path d="M52 86 Q 300 62 520 72 Q 610 78 632 158 L 624 500 Q 620 540 566 546 L 138 552 Q 78 548 72 496 L 60 170 Q 56 110 52 86 Z"/>
    </clipPath>
    <filter id="dfnSoftShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B1B3B" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="880" height="580" rx="14" fill="url(#dfnPlanBg)"/>

  <!-- giardino -->
  <path d="M52 86 Q 300 62 520 72 Q 610 78 632 158 L 624 500 Q 620 540 566 546 L 138 552 Q 78 548 72 496 L 60 170 Q 56 110 52 86 Z" fill="url(#dfnLawn)" stroke="#B7E1CB" stroke-width="2"/>

  <g clip-path="url(#dfnGardenClip)">
    <!-- fasce di copertura -->
    <circle cx="236" cy="338" r="292" fill="url(#dfnEmission)"/>
    <circle cx="236" cy="338" r="96" fill="none" stroke="#2FD08A" stroke-width="1.8" stroke-dasharray="5 6" opacity="0.75"/>
    <circle cx="236" cy="338" r="182" fill="none" stroke="#2FD08A" stroke-width="1.8" stroke-dasharray="8 8" opacity="0.55"/>
    <circle cx="236" cy="338" r="272" fill="none" stroke="#2FD08A" stroke-width="1.8" stroke-dasharray="11 9" opacity="0.4"/>

    <!-- piscina -->
    <rect x="420" y="286" width="172" height="96" rx="20" fill="url(#dfnPool)" stroke="#9FD5E8" stroke-width="2"/>
    <g stroke="#A9DEEE" stroke-width="2" opacity="0.8">
      <path d="M440 320 h 40"/><path d="M500 320 h 30"/><path d="M546 320 h 26"/>
      <path d="M440 344 h 26"/><path d="M486 344 h 44"/><path d="M548 344 h 24"/>
    </g>

    <!-- zona ospiti -->
    <path d="M356 128 Q 470 118 534 150 Q 566 210 540 254 Q 470 276 396 258 Q 356 214 356 128 Z" fill="#FFFFFF" fill-opacity="0.42" stroke="#0B1B3B" stroke-width="1.6" stroke-dasharray="4 6" opacity="0.7"/>
    <g fill="#122033" opacity="0.55">
      <circle cx="414" cy="176" r="12"/><circle cx="470" cy="162" r="12"/><circle cx="514" cy="192" r="12"/>
      <circle cx="430" cy="228" r="12"/><circle cx="492" cy="228" r="12"/>
    </g>
    <g fill="none" stroke="#122033" stroke-width="1.2" opacity="0.35">
      <circle cx="414" cy="176" r="20"/><circle cx="470" cy="162" r="20"/><circle cx="514" cy="192" r="20"/>
      <circle cx="430" cy="228" r="20"/><circle cx="492" cy="228" r="20"/>
    </g>

    <!-- tavoli ristorante -->
    <g opacity="0.7">
      <circle cx="448" cy="420" r="26" fill="#FFFFFF" stroke="#C7CFD6" stroke-width="1.6"/>
      <circle cx="448" cy="420" r="7" fill="#2FD08A" opacity="0.5"/>
      <circle cx="534" cy="446" r="22" fill="#FFFFFF" stroke="#C7CFD6" stroke-width="1.6"/>
      <circle cx="534" cy="446" r="6" fill="#2FD08A" opacity="0.5"/>
      <circle cx="486" cy="486" r="18" fill="#FFFFFF" stroke="#C7CFD6" stroke-width="1.6"/>
    </g>

    <!-- vegetazione -->
    <g fill="#2E8F62" opacity="0.35">
      <circle cx="112" cy="132" r="30"/><circle cx="158" cy="112" r="22"/><circle cx="90" cy="186" r="24"/>
      <circle cx="572" cy="112" r="26"/><circle cx="600" cy="462" r="30"/><circle cx="556" cy="500" r="20"/>
      <circle cx="118" cy="500" r="28"/><circle cx="152" cy="522" r="18"/>
    </g>

    <!-- sentiero -->
    <path d="M236 338 Q 348 344 420 286" fill="none" stroke="#E9E2CF" stroke-width="22" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- modulo -->
  <g>
    <circle cx="236" cy="338" r="52" fill="url(#dfnEmission)"/>
    <circle cx="236" cy="338" r="27" fill="#0B1B3B"/>
    <circle cx="236" cy="338" r="19" fill="#123045"/>
    <circle cx="236" cy="338" r="8" fill="#3FE0A0"/>
    <circle cx="236" cy="338" r="16" fill="none" stroke="#3FE0A0" stroke-width="2" opacity="0.6"/>
    <path d="M236 312 v-26" stroke="#0B1B3B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="236" cy="282" r="5" fill="#0B1B3B"/>
  </g>

  <!-- etichette copertura -->
  <g>
    <line x1="236" y1="338" x2="330" y2="238" stroke="#0E8F5B" stroke-width="1.2" opacity="0.55"/>
    <g>
      <rect x="330" y="224" width="96" height="28" rx="14" fill="#FFFFFF" stroke="#B7E1CB"/>
      <text x="378" y="243" text-anchor="middle" font-size="15" font-weight="700" fill="#0A7A4E">1.000 mq</text>
    </g>
    <g>
      <rect x="92" y="196" width="112" height="30" rx="15" fill="#0B1B3B"/>
      <text x="148" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#7CF0BC">fino a 4.000 mq</text>
    </g>
    <line x1="168" y1="226" x2="146" y2="292" stroke="#0B1B3B" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
  </g>

  <!-- nodo sensore bilancia -->
  <g>
    <rect x="286" y="386" width="58" height="34" rx="8" fill="#FFFFFF" stroke="#9FD5B8" stroke-width="1.6" filter="url(#dfnSoftShadow)"/>
    <rect x="294" y="394" width="42" height="6" rx="3" fill="#2FD08A" opacity="0.6"/>
    <rect x="294" y="404" width="28" height="6" rx="3" fill="#2FD08A" opacity="0.35"/>
    <line x1="270" y1="356" x2="300" y2="384" stroke="#0E8F5B" stroke-width="1.6" stroke-dasharray="4 4"/>
    <text x="315" y="438" text-anchor="middle" font-size="13" fill="#3F5B4E">bilancia smart</text>
  </g>

  <!-- etichetta zona ospiti -->
  <g>
    <rect x="396" y="286" width="112" height="26" rx="13" fill="#FFFFFF" stroke="#C9D6DF"/>
    <text x="452" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#33485C">zona ospiti</text>
  </g>

  <!-- raffiche di vento -->
  <g stroke="#C98A1F" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M74 286 q 24 -14 46 -2 t 44 -4"/>
    <path d="M82 304 q 20 -10 38 0"/>
  </g>
  <g>
    <rect x="70" y="316" width="132" height="26" rx="13" fill="#FFF6E4" stroke="#EBCB8F"/>
    <text x="136" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#8A5B0F">vento: flussi variabili</text>
  </g>

  <!-- flusso dati -->
  <path d="M264 328 C 340 268 420 214 508 196" fill="none" stroke="#2FD08A" stroke-width="2.4" stroke-dasharray="6 6" opacity="0.8"/>
  <circle cx="508" cy="196" r="5" fill="#2FD08A"/>

  <!-- pannello telemetria -->
  <g filter="url(#dfnSoftShadow)">
    <rect x="536" y="96" width="292" height="236" rx="16" fill="#0B1B3B"/>
  </g>
  <g>
    <text x="558" y="128" font-size="16" font-weight="700" fill="#FFFFFF">Telemetria H24</text>
    <circle cx="800" cy="122" r="5" fill="#3FE0A0"/>
    <text x="790" y="127" text-anchor="end" font-size="12" font-weight="700" fill="#7CF0BC">ONLINE</text>

    <text x="558" y="158" font-size="12.5" fill="#9CB0C4">Serbatoio attivo</text>
    <text x="808" y="158" text-anchor="end" font-size="13" font-weight="700" fill="#FFFFFF">72%</text>
    <rect x="558" y="168" width="250" height="8" rx="4" fill="#22374F"/>
    <rect x="558" y="168" width="180" height="8" rx="4" fill="#2FD08A"/>

    <text x="558" y="202" font-size="12.5" fill="#9CB0C4">Copertura presidiata</text>
    <text x="808" y="202" text-anchor="end" font-size="13" font-weight="700" fill="#FFFFFF">4.000 mq</text>
    <rect x="558" y="212" width="250" height="8" rx="4" fill="#22374F"/>
    <rect x="558" y="212" width="250" height="8" rx="4" fill="#3FE0A0" opacity="0.55"/>

    <text x="558" y="246" font-size="12.5" fill="#9CB0C4">Prossima ricarica</text>
    <text x="808" y="246" text-anchor="end" font-size="13" font-weight="700" fill="#FFFFFF">programmata</text>

    <rect x="558" y="262" width="250" height="46" rx="9" fill="#123045" stroke="#27506A"/>
    <text x="574" y="282" font-size="12" fill="#7CF0BC">Nessuna azione richiesta</text>
    <text x="574" y="298" font-size="11.5" fill="#93A9BE">Sincronizzato 2 minuti fa</text>
  </g>

  <!-- legenda -->
  <g>
    <circle cx="82" cy="574" r="5" fill="#2FD08A"/>
    <text x="94" y="578" font-size="13" fill="#3F5B4E">modulo attivo</text>
    <line x1="210" y1="574" x2="238" y2="574" stroke="#2FD08A" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="246" y="578" font-size="13" fill="#3F5B4E">area coperta</text>
    <rect x="358" y="565" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#9FD5B8"/>
    <text x="382" y="578" font-size="13" fill="#3F5B4E">sensore bilancia</text>
  </g>
</svg>
