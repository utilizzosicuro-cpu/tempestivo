<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Tre linee di stoviglie compostabili: bagassa, Charta FSC e cartoncino bio-coated</title>
<desc id="d">Confronto illustrato tra un piatto in bagassa color avana, un piatto Charta bianco in carta certificata FSC e un piatto in cartoncino con rivestimento biopolimero, con le rispettive temperature massime d'uso.</desc>
<defs>
  <linearGradient id="bgs" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7FAF5"/>
    <stop offset="1" stop-color="#E9F1E7"/>
  </linearGradient>
  <linearGradient id="pulp" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F4E8D2"/>
    <stop offset="1" stop-color="#DEC9A6"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#EDF1EE"/>
  </linearGradient>
  <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBF6EC"/>
    <stop offset="1" stop-color="#E7DCC8"/>
  </linearGradient>
</defs>
<rect width="1200" height="600" fill="url(#bgs)"/>
<circle cx="1050" cy="110" r="150" fill="#D9E8D4" opacity=".7"/>
<path d="M0 500h1200v100H0z" fill="#EFF5EC"/>

<g>
  <ellipse cx="220" cy="452" rx="150" ry="22" fill="#0B1B3B" opacity=".08"/>
