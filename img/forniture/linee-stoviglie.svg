  <ellipse cx="980" cy="452" rx="150" ry="22" fill="#0B1B3B" opacity=".08"/>
  <ellipse cx="980" cy="404" rx="146" ry="40" fill="url(#board)" stroke="#C9B18B" stroke-width="3"/>
  <ellipse cx="980" cy="396" rx="122" ry="31" fill="#FCF8F0"/>
  <path d="M860 396c22 24 218 24 240 0" fill="none" stroke="#DCC9A8" stroke-width="3"/>
  <text x="980" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#8A6E4A">CARTONCINO</text>
</g>

<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
  <text x="220" y="512" font-size="20" font-weight="700" fill="#0B1B3B">Polpa di canna</text>
  <text x="220" y="540" font-size="17" fill="#475569">Caldo, microonde, forno</text>
  <rect x="140" y="556" width="160" height="30" rx="15" fill="#2F8F5B"/>
  <text x="220" y="577" font-size="16" font-weight="700" fill="#FFFFFF">EN 13432 · MOCA</text>

  <text x="600" y="512" font-size="20" font-weight="700" fill="#0B1B3B">Carta FSC</text>
  <text x="600" y="540" font-size="17" fill="#475569">Presentazione, alimenti secchi</text>
  <rect x="520" y="556" width="160" height="30" rx="15" fill="#2F8F5B"/>
  <text x="600" y="577" font-size="16" font-weight="700" fill="#FFFFFF">FSC-C169099</text>

  <text x="980" y="512" font-size="20" font-weight="700" fill="#0B1B3B">Cartoncino bio-coated</text>
