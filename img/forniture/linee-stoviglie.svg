  <ellipse cx="220" cy="396" rx="122" ry="31" fill="#FBF3E4"/>
  <path d="M100 396c22 24 218 24 240 0" fill="none" stroke="#C9B18B" stroke-width="3"/>
  <text x="220" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#8A6E4A">BAGASSA</text>

  <ellipse cx="600" cy="452" rx="150" ry="22" fill="#0B1B3B" opacity=".08"/>
  <ellipse cx="600" cy="404" rx="146" ry="40" fill="url(#paper)" stroke="#C9CFC9" stroke-width="3"/>
  <ellipse cx="600" cy="396" rx="122" ry="31" fill="#FFFFFF"/>
  <path d="M480 396c22 24 218 24 240 0" fill="none" stroke="#D5DAD5" stroke-width="3"/>
